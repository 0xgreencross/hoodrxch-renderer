<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HOODRXCH — reference renderer</title>
<style>
:root{--bg:#0b0b0b;--panel:#141414;--line:#2a2a2a;--fg:#d8d8d8;--acid:#CCFF00;--red:#FF2A2A;--mute:#777}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#000}
header h1{font-size:14px;margin:0 16px 0 0;color:var(--acid);letter-spacing:.12em}
header button{background:#1a1a1a;color:var(--fg);border:1px solid var(--line);padding:5px 10px;cursor:pointer;font:inherit}
header button.on{background:var(--acid);color:#000;border-color:var(--acid)}
.tab{display:none;padding:12px}
.tab.on{display:block}
#wb.on{display:grid;grid-template-columns:300px 1fr 360px;gap:12px;height:calc(100vh - 60px)}
.panel{background:var(--panel);border:1px solid var(--line);padding:10px;overflow:auto}
.panel h2{font-size:11px;letter-spacing:.15em;color:var(--mute);margin:10px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:3px 0}
.row label{color:#aaa;flex:1}
.row input[type=number],.row select,.row input[type=text]{width:130px;background:#000;color:var(--fg);border:1px solid var(--line);padding:3px 5px;font:inherit}
.row input[type=checkbox]{width:auto}
.views{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.view{display:flex;flex-direction:column;gap:4px;align-items:center}
.view span{font-size:10px;color:var(--mute)}
.sq{display:block;image-rendering:auto}
.black{background:#000}.white{background:#fff}
.circ{border-radius:50%;overflow:hidden}
pre{white-space:pre-wrap;word-break:break-all;font-size:10px;color:#9a9a9a;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.grid .cell{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--mute)}
.grid .cell svg{width:64px;height:64px}
.sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sheet .tok{display:flex;gap:8px;align-items:flex-end;background:#000;padding:6px;border:1px solid var(--line)}
.sheet .tok .big{width:256px;height:256px}
.sheet .tok .mid{width:64px;height:64px}
.sheet .tok .sm{width:32px;height:32px}
.sheet .tok .meta{font-size:9px;color:var(--mute);width:130px}
table{border-collapse:collapse;font-size:11px}
td,th{border:1px solid var(--line);padding:3px 8px;text-align:left}
th{color:var(--acid)}
.bar{display:inline-block;height:8px;background:var(--acid);vertical-align:middle}
.warn{color:var(--red)}
.ok{color:var(--acid)}
.evo{display:flex;gap:8px;flex-wrap:wrap}
.evo .e{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mute)}
.evo .e svg{width:150px;height:150px;background:#000}
.fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fx .f{background:#000;border:1px solid var(--line);padding:6px;font-size:10px}
.fx .f svg{width:100%;aspect-ratio:1}
.bannerwrap svg{width:100%;max-width:1500px;display:block}
a.btn{display:inline-block;background:var(--acid);color:#000;padding:5px 10px;text-decoration:none;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>HOODRXCH // RENDERER V1</h1>
  <button data-tab="wb" class="on">Workbench</button>
  <button data-tab="review">Review 24</button>
  <button data-tab="gallery">Gallery 666</button>
  <button data-tab="evo">Evolution</button>
  <button data-tab="fx">Fixtures</button>
  <button data-tab="banner">Banner</button>
  <span style="margin-left:auto;color:var(--mute)" id="ver"></span>
</header>

<div id="wb" class="tab on">
  <div class="panel" id="controls"></div>
  <div class="panel"><div class="views" id="views"></div></div>
  <div class="panel"><h2>METADATA JSON</h2><pre id="json"></pre><h2>SVG</h2><div id="size"></div><pre id="svgsrc"></pre></div>
</div>
<div id="review" class="tab"><div class="row"><label>Seed set</label><input type="number" id="reviewSeed" value="1" style="width:80px"><button id="reviewGo">Redraw 24</button></div><div class="sheet" id="sheet"></div></div>
<div id="gallery" class="tab"><div id="rarity"></div><div class="grid" id="gal"></div></div>
<div id="evo" class="tab"><h2 style="color:var(--mute)">KILLS 0 / 1 / 10 / 25 / 50 / 75 / 100</h2><div class="evo" id="evoKills"></div><h2 style="color:var(--mute)">DEATH 1 → EXHUMED → DEATH 2 → EXHUMED → DEATH 3</h2><div class="evo" id="evoDeaths"></div><h2 style="color:var(--mute)">STATUS OVERLAYS</h2><div class="evo" id="evoStatus"></div></div>
<div id="fx" class="tab"><a class="btn" id="exportFx" href="#">Export fixtures.json</a><div id="fxSummary"></div><div class="fx" id="fxGrid"></div></div>
<div id="banner" class="tab"><div class="bannerwrap" id="bannerOut"></div></div>

<script>
'use strict';
// ============================================================================
// HOODRXCH reference renderer — single file, vanilla JS, no deps.
// Mirrors contracts/ one-to-one. Same state → byte-identical SVG.
// ============================================================================
const RENDERER_VERSION = 1, SCHEMA_VERSION = 1;
const BLACK = '#000000', ACID = '#CCFF00', RED = '#FF2A2A';
